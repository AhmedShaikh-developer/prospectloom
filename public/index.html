<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProspectLoom</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Apply the saved theme before the first paint (no flash). Dark is the default.
    (function () {
      var t = null; try { t = localStorage.getItem('pl-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 4v5h-5M3 20v-5h5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m6 4 14 8-14 8z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></symbol>
  </svg>
  <div class="layout">
    <aside class="sidebar" data-testid="sidebar">
      <div class="brand"><img src="/logo.svg" class="logo-svg" id="brand-mark" alt="ProspectLoom" width="40" height="40"><div><strong id="brand-name">ProspectLoom</strong><small id="brand-sub">Outreach autopilot</small></div></div>
      <nav>
        <a href="#/dashboard" data-nav="dashboard"><svg class="i"><use href="#i-home"/></svg>Dashboard</a>
        <div class="nav-group">Leads</div>
        <a href="#/engine" data-nav="engine"><svg class="i"><use href="#i-bolt"/></svg>Lead engine <span class="pill on" id="nav-engine"></span></a>
        <a href="#/import" data-nav="import"><svg class="i"><use href="#i-pin"/></svg>Find &amp; import</a>
        <a href="#/companies" data-nav="companies"><svg class="i"><use href="#i-building"/></svg>Companies</a>
        <a href="#/research" data-nav="research"><svg class="i"><use href="#i-search"/></svg>Research runs</a>
        <div class="nav-group">Outreach</div>
        <a href="#/outreach" data-nav="outreach"><svg class="i"><use href="#i-send"/></svg>Outreach <span class="pill" id="nav-outreach"></span></a>
        <a href="#/replies" data-nav="replies"><svg class="i"><use href="#i-inbox"/></svg>Replies &amp; pipeline <span class="pill" id="nav-replies"></span></a>
        <div class="nav-group">System</div>
        <a href="#/hubspot" data-nav="hubspot" hidden><svg class="i"><use href="#i-sync"/></svg>HubSpot sync <span class="pill" id="nav-hubspot"></span></a>
        <a href="#/integrations" data-nav="integrations"><svg class="i"><use href="#i-plug"/></svg>Integrations <span class="pill" id="nav-integrations"></span></a>
        <a href="#/suppression" data-nav="suppression"><svg class="i"><use href="#i-shield"/></svg>Suppression</a>
        <a href="#/setup" data-nav="setup"><svg class="i"><use href="#i-book"/></svg>Setup guide</a>
        <a href="#/settings" data-nav="settings"><svg class="i"><use href="#i-gear"/></svg>Settings</a>
      </nav>
      <div class="jobs-tray" id="jobs-tray" data-testid="jobs-tray" aria-live="polite"></div>
      <div class="sidebar-foot" id="mode-badge"></div>
    </aside>
    <div class="content">
      <header class="topbar" data-testid="topbar">
        <div class="greet" id="greet"></div>
        <div class="spacer"></div>
        <a class="btn icon-btn" href="#/replies" title="Replies" aria-label="Replies"><svg class="i"><use href="#i-bell"/></svg><span class="dot" id="bell-dot" hidden></span></a>
        <button class="icon-btn" id="theme-toggle" data-testid="theme-toggle" title="Switch dark / light" aria-label="Switch dark / light theme"><svg class="i theme-ico-moon"><use href="#i-moon"/></svg><svg class="i theme-ico-sun"><use href="#i-sun"/></svg></button>
        <div class="user-menu" id="user-menu" hidden><button class="avatar" id="user-btn" data-testid="user-menu" aria-haspopup="true" aria-label="Account"></button>
          <div class="menu" id="user-pop" hidden><div class="menu-h"><strong id="um-name"></strong><span id="um-email"></span></div>
            <a href="#/settings?tab=security"><svg class="i"><use href="#i-shield"/></svg>Security &amp; 2FA</a>
            <button type="button" id="um-logout" data-testid="sign-out"><svg class="i"><use href="#i-back"/></svg>Sign out</button></div></div>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal" hidden><div class="modal-box"><div id="modal-body"></div></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
